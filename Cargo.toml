[package]
name = "pda-deposit-oncurve-experiment"
version = "0.1.0"
edition = "2021"

[dev-dependencies]
litesvm = "0.16"
litesvm-token = "0.16"
solana-address = { version = "2.6.1", features = ["curve25519", "sha2"] }
solana-keypair = "3.1.2"
solana-message = "4.1.0"
solana-native-token = "3.0.0"
solana-program-pack = "3.1.0"
solana-signature = "3.1.0"
solana-signer = "3.0.1"
solana-system-interface = { version = "3.2.0", features = ["bincode"] }
solana-transaction = { version = "4.1.5", features = ["verify"] }
spl-token-interface = "3.0.0"

